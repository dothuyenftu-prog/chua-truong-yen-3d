<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chùa Trường Yến 3D — Ban Tam Bảo • Ban Thần Tài Thổ Địa • Đồng Tu Tương Tác</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14100c;
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f5f5f4;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* 3D Name Tags & Speech Bubbles Overlay */
  #labels-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
  }
  .char-label {
    position: absolute;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .char-speech {
    background: rgba(255, 255, 255, 0.94);
    color: #1c1917;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    max-width: 190px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    border: 1.5px solid #f59e0b;
    position: relative;
    animation: popIn 0.25s ease-out;
  }
  .char-speech::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 5px 5px 0;
    border-style: solid;
    border-color: #fff transparent;
  }
  .char-nametag {
    background: rgba(20, 16, 12, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fde68a;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }
  .char-nametag.is-player {
    background: rgba(217, 119, 6, 0.85);
    color: #fff;
    border-color: #fef08a;
  }
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Frosted Glass UI System (Sansa Korean Temple App Style) */
  .glass-pill {
    background: rgba(28, 25, 23, 0.62);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    color: #f5f5f4;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  /* Top Bar */
  #top-bar {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: none;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .top-left-group {
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
  }
  .icon-circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
  }
  .room-select-pill {
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
  }
  .room-select-pill select {
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
  }
  .room-select-pill select option {
    background: #1c1917;
    color: #fff;
  }

  .top-right-stats {
    pointer-events: auto;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .stat-item b {
    color: #fde68a;
    font-weight: 800;
  }

  /* Altar Switcher Bar (Ban Tam Bảo | Ban Thần Tài Thổ Địa | Am Xả Nghiệp) */
  .altar-tabs-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    pointer-events: auto;
  }
  .altar-tab {
    padding: 7px 12px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    transition: all 0.2s;
  }
  .altar-tab.active {
    background: linear-gradient(135deg, rgba(217, 119, 6, 0.88), rgba(146, 64, 14, 0.88));
    border-color: #fde047;
    color: #fff;
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
  }
  .altar-tab.active-rage {
    background: linear-gradient(135deg, rgba(220, 38, 38, 0.88), rgba(127, 29, 29, 0.88));
    border-color: #fca5a5;
    color: #fff;
  }

  .sub-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .merit-badge {
    pointer-events: auto;
    padding: 6px 12px;
    font-size: 11.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chant-btn {
    pointer-events: auto;
    padding: 7px 13px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(253, 224, 71, 0.45);
  }
  .chant-btn.active {
    background: rgba(217, 119, 6, 0.85);
    border-color: #fde047;
    box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
  }

  /* Center Translucent Feed Toast (Exact Sansa Center Toast) */
  #live-feed-pill {
    position: fixed;
    top: 34%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    padding: 10px 20px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: rgba(28, 25, 23, 0.65);
  }

  /* Floating Merit / Curse Popups */
  #floating-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    overflow: hidden;
  }
  .float-pop {
    position: absolute;
    font-weight: 800;
    font-size: 15px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    animation: popFloat 1.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  @keyframes popFloat {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -12px) scale(1.08); }
    100% { opacity: 0; transform: translate(-50%, -95px) scale(0.95); }
  }

  /* Virtual Walk Joystick (Bottom Left above dock) */
  #joystick-zone {
    position: fixed;
    bottom: 144px;
    left: 14px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(28, 25, 23, 0.48);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255, 255, 255, 0.24);
    z-index: 20;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #joystick-knob {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  #joystick-hint {
    position: absolute;
    bottom: -18px;
    width: 110px;
    text-align: center;
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 4px #000;
    pointer-events: none;
  }

  /* Quick Camera & Interaction Side Buttons */
  #quick-side-btns {
    position: fixed;
    bottom: 144px;
    right: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }
  .mini-pill-btn {
    padding: 7px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
  }

  /* Live Multiplayer Chat Input Bar right above Bottom Dock */
  #live-chat-bar {
    position: fixed;
    bottom: 94px;
    left: 50%;
    transform: translateX(-50%);
    width: min(94vw, 520px);
    z-index: 20;
    display: flex;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 999px;
    background: rgba(24, 21, 19, 0.68);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  #live-chat-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
  }
  #live-chat-input::placeholder {
    color: rgba(255,255,255,0.55);
  }
  .chat-quick-btn {
    background: rgba(217, 119, 6, 0.75);
    border: 1px solid #fde047;
    color: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Bottom Frosted Glass Dock */
  #bottom-bar-wrap {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: min(94vw, 520px);
  }
  #bottom-glass-dock {
    width: 100%;
    height: 74px;
    border-radius: 38px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    padding: 5px 8px;
    background: rgba(28, 25, 23, 0.66);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }
  .dock-action {
    border: none;
    background: transparent;
    color: #e7e5e4;
    height: 62px;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .dock-action svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dock-action.active {
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fde68a;
  }
  .dock-action.rage-highlight {
    color: #fca5a5;
  }

  /* Slide-up Glass Drawer */
  #drawer-modal {
    position: fixed;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: min(94vw, 520px);
    max-height: 52vh;
    overflow-y: auto;
    z-index: 30;
    padding: 15px;
    border-radius: 24px;
    background: rgba(24, 21, 19, 0.90);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    display: none;
    opacity: 0;
    transition: all 0.22s ease;
  }
  #drawer-modal.open {
    display: block;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13.5px;
    font-weight: 800;
    color: #fde68a;
  }
  .drawer-close {
    background: rgba(255,255,255,0.14);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 800;
  }
  .preset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .preset-btn {
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #f5f5f4;
    padding: 9px 10px;
    border-radius: 13px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  .preset-btn.rage-btn {
    background: rgba(185, 28, 28, 0.35);
    border-color: rgba(248, 113, 113, 0.45);
    color: #fee2e2;
  }
  .preset-btn.gold-btn {
    background: rgba(217, 119, 6, 0.32);
    border-color: rgba(251, 191, 36, 0.45);
    color: #fef3c7;
  }
  .drawer-input-row {
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }
  .drawer-input-row input {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 11px;
    padding: 8px 11px;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  .drawer-send-btn {
    background: linear-gradient(135deg, #d97706, #92400e);
    border: 1px solid #fbbf24;
    color: #fff;
    font-weight: 800;
    padding: 8px 13px;
    border-radius: 11px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }

  /* Boss HP Bar inside Rage Hall */
  #boss-banner {
    position: fixed;
    top: 132px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 18;
    width: min(92vw, 420px);
    padding: 9px 15px;
    border-radius: 18px;
    background: rgba(45, 10, 14, 0.82);
    backdrop-filter: blur(14px);
    border: 1.5px solid rgba(248, 113, 113, 0.65);
    display: none;
    flex-direction: column;
    gap: 5px;
  }
  .boss-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 800;
    color: #fecaca;
  }
  .boss-hp-track {
    height: 8px;
    background: rgba(0,0,0,0.5);
    border-radius: 99px;
    overflow: hidden;
  }
  .boss-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ef4444, #fb923c);
    transition: width 0.2s;
  }
  .boss-speech {
    font-size: 11.5px;
    color: #fde68a;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="labels-layer"></div>
<div id="floating-layer"></div>

<!-- Top Frosted Glass HUD -->
<div id="top-bar">
  <div class="top-row">
    <div class="top-left-group">
      <button class="glass-pill icon-circle-btn" onclick="toggleWideView()" title="Đổi góc nhìn">
        🎥
      </button>
      <div class="glass-pill room-select-pill">
        <select id="avatar-select" onchange="changeAvatarName(this.value)">
          <option value="Sếp Thành">🧘 Sếp Thành ▾</option>
          <option value="Sale Minh Anh">🧘 Sale Minh Anh ▾</option>
          <option value="Sale Kiều Trang">🧘 Sale Kiều Trang ▾</option>
          <option value="Sale Huế">🧘 Sale Huế ▾</option>
          <option value="Sale Bích Thủy">🧘 Sale Bích Thủy ▾</option>
          <option value="Sale Ánh Nguyệt">🧘 Sale Ánh Nguyệt ▾</option>
          <option value="Thế Anh">🧘 Thế Anh ▾</option>
        </select>
      </div>
    </div>

    <div class="glass-pill top-right-stats">
      <div class="stat-item">👥 <b id="online-count">98</b></div>
      <div class="stat-item">🙇 <b id="bow-count">0</b></div>
      <div class="stat-item">✨ <b id="merit-count">888</b></div>
    </div>
  </div>

  <!-- 3 Sacred Zones Switcher: Ban Tam Bảo | Ban Thần Tài - Thổ Địa | Am Xả Nghiệp -->
  <div class="altar-tabs-row">
    <button class="glass-pill altar-tab active" id="btn-zone-tambao" onclick="goToZone('tambao')">
      🏛️ Ban Tam Bảo
    </button>
    <button class="glass-pill altar-tab" id="btn-zone-thantai" onclick="goToZone('thantai')">
      💰 Ban Thần Tài - Thổ Địa
    </button>
    <button class="glass-pill altar-tab" id="btn-zone-rage" onclick="goToZone('rage')">
      🔥 Am Xả Nghiệp
    </button>
  </div>

  <div class="sub-top-row">
    <button class="glass-pill chant-btn" id="btn-chant-audio" onclick="toggleRealChanting()">
      📿 Bật Tụng Kinh & Gõ Mõ Thật
    </button>

    <button class="glass-pill chant-btn" id="btn-auto-bow" onclick="toggleAutoBow()">
      🙏 Tự Lạy 108 Lạy
    </button>
  </div>
</div>

<!-- Boss Banner (only shown in Am Xả Nghiệp) -->
<div id="boss-banner">
  <div class="boss-top">
    <span id="boss-title">👻 BIA: KHÁCH HỎI 100 MÃ KHÔNG CHỐT</span>
    <span id="boss-hp-label">Độ Lì: 100%</span>
  </div>
  <div class="boss-hp-track"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
  <div class="boss-speech" id="boss-speech">"Cho anh xin báo giá 50 mã nữa rồi anh... về hỏi ý kiến vợ đã nhé!"</div>
</div>

<!-- Center Translucent Live Feed Pill -->
<div class="glass-pill" id="live-feed-pill">
  Chạm vào người bên cạnh để vái chào nhau hoặc gõ chat bên dưới 🙏
</div>

<!-- Virtual Joystick for Walking Around the Temple Hall -->
<div id="joystick-zone">
  <div id="joystick-knob"></div>
  <div id="joystick-hint">Kéo để đi bộ</div>
</div>

<!-- Quick Interaction Side Buttons -->
<div id="quick-side-btns">
  <button class="glass-pill mini-pill-btn" onclick="greetNearestPerson()">🙌 Vái Chào Người Bên Cạnh</button>
  <button class="glass-pill mini-pill-btn" onclick="shakeFortune()">🎋 Xin Quẻ Đại Cát</button>
</div>

<!-- Live Chat & Interaction Bar -->
<div id="live-chat-bar">
  <input id="live-chat-input" type="text" placeholder="💬 Nhắn tin tương tác với mọi người trong chùa (Enter để gửi)..." onkeydown="if(event.key==='Enter') sendLiveChat()" />
  <button class="chat-quick-btn" onclick="sendLiveChat()">Gửi</button>
</div>

<!-- Slide-up Glass Drawer -->
<div id="drawer-modal">
  <div class="drawer-header">
    <span id="drawer-title">🙏 DÂNG HƯƠNG & KHẤN NGUYỆN</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<!-- Bottom Frosted Glass Bar -->
<div id="bottom-bar-wrap">
  <div id="bottom-glass-dock">
    <button class="dock-action active" id="act-chaptay" onclick="doChapTay()">
      <svg viewBox="0 0 24 24"><path d="M12 2L9 12l3 9 3-9-3-10z"/><path d="M7 13l5-11 5 11"/></svg>
      <span id="label-chaptay">Chắp tay</span>
    </button>

    <button class="dock-action" id="act-quylay" onclick="doQuyLay()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M6 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M4 21h16"/></svg>
      <span>Quỳ lạy</span>
    </button>

    <button class="dock-action" id="act-mo" onclick="doGoMo()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="19" cy="14" r="2"/><circle cx="15" cy="19" r="2"/><circle cx="9" cy="19" r="2"/><circle cx="5" cy="14" r="2"/><circle cx="7" cy="8" r="2"/></svg>
      <span>Gõ mõ thật</span>
    </button>

    <button class="dock-action" id="act-khan" onclick="openDrawer('khan')">
      <svg viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M9 4v4"/><path d="M15 4v4"/><path d="M6 12h12l-1 8H7l-1-8z"/></svg>
      <span>Khấn lộc</span>
    </button>

    <button class="dock-action rage-highlight" id="act-xanghiep" onclick="openDrawer('rage')">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Xả nghiệp</span>
    </button>
  </div>
</div>

<script>
/* =========================================================
   1. REAL MP3 AUDIO ENGINE (Mõ Gỗ Thật, Chuông Đồng Thật, Tụng Kinh Tam Bảo & Khấn Thần Tài)
   ========================================================= */
const audioMoPool = [
  new Audio('audio/mo_that.mp3'),

let audioCtx = null;
function fallbackSynthMo() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.09);
    g.gain.setValueAtTime(0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.15);
  } catch (e) {}
}

function playThunderSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const bufSize = audioCtx.sampleRate * 0.4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.12));
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.9, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
    noise.connect(gain); gain.connect(audioCtx.destination);
    noise.start(now);
  } catch (e) {}
}

/* =========================================================
   3. PROCEDURAL TEXTURES (Wood Floor, Ornate Mandala, Plaques)
   ========================================================= */
function createWoodFloorTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#36271c';
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y += 64) {
    ctx.fillStyle = (y / 64) % 2 === 0 ? '#3a2a1e' : '#322318';
    ctx.fillRect(0, y, 512, 62);
    ctx.fillStyle = '#1f150e';
    ctx.fillRect(0, y + 62, 512, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 10);
  return tex;
}

function createPlaqueTexture(text, bg = '#7f1d1d', border = '#fbbf24') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 128);
  ctx.strokeStyle = border;
  ctx.lineWidth = 8;
  ctx.strokeRect(8, 8, 496, 112);
  ctx.fillStyle = '#fde047';
  ctx.font = '900 34px "Be Vietnam Pro", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  return new THREE.CanvasTexture(c);
}

function createMandalaBackdropTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const bgGrad = ctx.createRadialGradient(512, 256, 30, 512, 256, 520);
  bgGrad.addColorStop(0, '#5c2d16');
  bgGrad.addColorStop(0.5, '#3b190d');
  bgGrad.addColorStop(1, '#1e0d07');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1024, 512);

  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 10;
  ctx.strokeRect(14, 14, 996, 484);

  // 3 Sacred Mandalas for Tam Bảo (Center Buddha + Left Quan Âm + Right Thế Chí)
  [200, 512, 824].forEach((cx, i) => {
    const maxR = i === 1 ? 185 : 130;
    const rings = [maxR, maxR * 0.8, maxR * 0.6, maxR * 0.4];
    const cols = ['#15803d', '#b91c1c', '#d97706', '#f59e0b'];
    rings.forEach((r, idx) => {
      ctx.beginPath();
      ctx.arc(cx, 250, r, 0, Math.PI * 2);
      ctx.fillStyle = cols[idx];
      ctx.globalAlpha = 0.72;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fde68a';
      ctx.stroke();
    });
  });
  ctx.globalAlpha = 1.0;
  return new THREE.CanvasTexture(c);
}

let mqttClient = null;
const remotePlayers = {};
const MQTT_TOPIC = 'truongyen/chua3d/live_hall_v3';

try {
  if (window.mqtt) {
    mqttClient = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      mqttClient.subscribe(MQTT_TOPIC);
      broadcastState('join', `${state.avatarName} vừa bước vào Chánh Điện 🙏`);
    });
    mqttClient.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        if (!data || data.cid === myClientId) return;
        handleRemotePlayerEvent(data);
      } catch (e) {}
    });
  }
} catch (e) {}

function broadcastState(type, text = '') {
  if (!mqttClient || !mqttClient.connected) return;
  try {
    mqttClient.publish(MQTT_TOPIC, JSON.stringify({
      cid: myClientId,
      name: state.avatarName,
      type,
      text,
      x: Number(player.root.position.x.toFixed(2)),
      z: Number(player.root.position.z.toFixed(2)),
      bow: state.bowState
    }));
  } catch (e) {}
}

function handleRemotePlayerEvent(data) {
  let rp = remotePlayers[data.cid];
  if (!rp) {
    const dev = createChibiDevotee(false);
    dev.root.position.set(data.x || 0, 0.14, data.z || 3);
    scene.add(dev.root);
    dev.label = createCharLabelDOM(data.name || 'Đồng tu', false, () => {
      showBubbleOnChar(player, `Chào ${data.name} nhé! 🙏`, 4000);
      broadcastState('chat', `Chào ${data.name} nhé! 🙏`);
    });
    rp = { ...dev, name: data.name, targetPos: new THREE.Vector3(data.x || 0, 0.14, data.z || 3) };
    remotePlayers[data.cid] = rp;
  }
  rp.label.tag.textContent = data.name;
  if (typeof data.x === 'number' && typeof data.z === 'number') {
    rp.targetPos.set(data.x, 0.14, data.z);
  }
  if (data.type === 'chat' && data.text) {
    showBubbleOnChar(rp, data.text, 6000);
    showFeedToast(`💬 ${data.name}: "${data.text}"`);
    playRealMo();
  } else if (data.type === 'bow') {
    showBubbleOnChar(rp, '🙇 Thành tâm lễ Phật...', 3500);
    showFeedToast(`🙇 ${data.name} vừa thành tâm quỳ lạy trước Tam Bảo`);
  }
}

// Virtual Joystick
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false;

function handleJoyMove(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const maxR = 28;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / maxR;
  joyVec.y = dy / maxR;
}
joyZone.addEventListener('pointerdown', (e) => { e.stopPropagation(); joyActive = true; handleJoyMove(e.clientX, e.clientY); });
window.addEventListener('pointermove', (e) => { if (joyActive) handleJoyMove(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => {
  if (!joyActive) return;
  joyActive = false;
  joyKnob.style.transform = 'translate(0px, 0px)';
  joyVec.x = 0; joyVec.y = 0;
  broadcastState('move');
});

}

        <button class="preset-btn gold-btn" onclick="sendPrayer('Con lạy Thần Tài Thổ Địa độ cho hôm nay khách hỏi là chốt, chuyển khoản cọc 100%!')">💰 Khấn Khách Chốt Đơn CK 100%</button>
        <button class="preset-btn gold-btn" onclick="sendPrayer('Cầu cho đơn cắt Nhôm MG và Lam Sóng xuất kho chuẩn kích thước, xe đi đúng giờ!')">🛡️ Khấn Đơn Nhôm MG & Xe Đúng Giờ</button>

        <button class="preset-btn rage-btn" onclick="curseAttack('xe', 'Hẹn 2h chiều bốc hàng mà 8h tối vẫn bảo đang ở đầu ngõ à?!')">🚚 Chửi Xe: "Hẹn 2h chiều mà 8h tối chưa tới?!"</button>

function curseAttack(targetType = 'khach', preset = null) {
  const inp = document.getElementById('curse-inp');
  const txt = preset || (inp && inp.value.trim()) || "Làm ăn cho chuẩn chỉ vào nhé!";
  if (inp) inp.value = '';

  state.bossType = targetType;
  const dmg = 24 + Math.floor(Math.random() * 14);
  state.bossHp = Math.max(0, state.bossHp - dmg);
  bossWobble = 1.6;

  const proj = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xfde047 })
  );
  proj.position.copy(player.root.position).add(new THREE.Vector3(0, 1.5, 0));
  scene.add(proj);
  projectiles.push({ mesh: proj, t: 0 });

  playThunderSound();
  showBubbleOnChar(player, `⚡ ${txt}`, 4500);

  document.getElementById('boss-title').textContent = targetType === 'khach'
    ? '👻 BIA: KHÁCH HỎI 100 MÃ KHÔNG CHỐT'
    : '🚚 BIA: NHÀ XE HẸN GIỜ CAO SU';
  document.getElementById('boss-hp-label').textContent = `Độ Lì: ${state.bossHp}%`;
  document.getElementById('boss-hp-fill').style.width = `${state.bossHp}%`;
  document.getElementById('boss-speech').textContent = targetType === 'khach'
    ? '"Á á em chừa rồi! Để em chuyển khoản cọc 100% chốt đơn ngay bây giờ ạ!"'
    : '"Ối dồi ôi em đạp ga chạy tốc độ bàn thờ vào kho bốc hàng ngay đây ạ!"';

  spawnFloat(`⚡ ${txt} (-${dmg}%)`, '#fca5a5', 50, 35);

  if (state.bossHp === 0) {
    state.bossHp = 100;
    state.merit += 100;
    updateHUD();
    playRealBell();
    spawnFloat('🎉 ĐÃ ĐỘ XONG! +100 CÔNG ĐỨC!', '#fde047', 50, 30);
  }
}

/* =========================================================
   9. 60 FPS ANIMATION & 3D SPEECH BUBBLE PROJECTION LOOP
   ========================================================= */
const clock = new THREE.Clock();
const tempVec = new THREE.Vector3();

function updateLabelPosition(charObj, heightOffset = 2.45) {
  if (!charObj || !charObj.label) return;
  if (state.zone === 'rage' && charObj !== player) {
    charObj.label.wrap.style.display = 'none';
    return;
  }
  tempVec.copy(charObj.root.position);
  tempVec.y += heightOffset;
  tempVec.project(camera);

  if (tempVec.z > 1) {
    charObj.label.wrap.style.display = 'none';
    return;
  }
  const x = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;
  charObj.label.wrap.style.display = 'flex';
  charObj.label.wrap.style.left = `${x}px`;
  charObj.label.wrap.style.top = `${y}px`;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.getElapsedTime();

  // 1. Player Movement
  let moveX = joyVec.x;
  let moveZ = joyVec.y;
  if (keys['KeyW'] || keys['ArrowUp']) moveZ = -1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ = 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

  if ((Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05) && state.bowState === 0) {
    const speed = 4.0 * dt;
    const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    player.root.position.addScaledVector(forward, -moveZ * speed);
    player.root.position.addScaledVector(right, moveX * speed);

    player.root.position.x = Math.max(-10.0, Math.min(10.0, player.root.position.x));
    player.root.position.z = Math.max(-7.5, Math.min(11.5, player.root.position.z));

    player.root.rotation.y = Math.atan2(-moveX, moveZ) + camYaw;
    player.bodyPivot.position.y = Math.abs(Math.sin(elapsed * 12)) * 0.08;
    player.bodyPivot.rotation.z = Math.sin(elapsed * 12) * 0.06;
  } else {
    player.bodyPivot.position.y = 0;
    player.bodyPivot.rotation.z = 0;
  }

  // 2. Player Prostration Animation
  if (state.bowState === 1) {
    state.bowTimer += dt * 2.2;
    const p = Math.min(1, state.bowTimer);
    player.bodyPivot.rotation.x = -p * 1.38;
    player.bodyPivot.position.y = -p * 0.35;
    player.bodyPivot.position.z = -p * 0.35;
    if (p >= 1) { state.bowState = 2; state.bowTimer = 0; }
  } else if (state.bowState === 2) {
    state.bowTimer += dt * 2.4;
    if (state.bowTimer >= 1) { state.bowState = 3; state.bowTimer = 0; }
  } else if (state.bowState === 3) {
    state.bowTimer += dt * 2.2;
    const p = 1 - Math.min(1, state.bowTimer);
    player.bodyPivot.rotation.x = -p * 1.38;
    player.bodyPivot.position.y = -p * 0.35;
    player.bodyPivot.position.z = -p * 0.35;
    if (state.bowTimer >= 1) {
      state.bowState = 0;
      player.bodyPivot.rotation.x = 0;
      player.bodyPivot.position.set(0, 0, 0);
      if (state.autoBow) setTimeout(doQuyLay, 280);
    }
  }

  // 3. NPC Crowd Animation & Labels
  npcs.forEach(npc => {
    npc.root.visible = (state.zone !== 'rage');
    if (!npc.root.visible) {
      if (npc.label) npc.label.wrap.style.display = 'none';
      return;
    }
    if (npc.mode === 0) {
      const cyc = (elapsed * 0.9 + npc.phase) % 5.2;
      let b = 0;
      if (cyc < 1.2) b = cyc / 1.2;
      else if (cyc < 2.2) b = 1.0;
      else if (cyc < 3.4) b = 1.0 - (cyc - 2.2) / 1.2;
      npc.bodyPivot.rotation.x = -b * 1.32;
      npc.bodyPivot.position.y = -b * 0.32;
      npc.bodyPivot.position.z = -b * 0.30;
    } else if (npc.mode === 1) {
      npc.bodyPivot.position.y = -0.25 + Math.sin(elapsed * 2 + npc.phase) * 0.015;
      npc.bodyPivot.rotation.x = -0.06;
    } else {
      npc.bodyPivot.rotation.x = -0.08 - Math.sin(elapsed * 1.5 + npc.phase) * 0.06;
    }
    if (npc.label) updateLabelPosition(npc, 2.38);
  });

  // Remote Players interpolation & labels
  Object.values(remotePlayers).forEach(rp => {
    rp.root.position.lerp(rp.targetPos, 0.15);
    updateLabelPosition(rp, 2.38);
  });

  // 4. Boss Wobble & Projectiles
  if (bossWobble > 0) {
    bossWobble = Math.max(0, bossWobble - dt * 2.8);
    bossPivot.rotation.z = Math.sin(elapsed * 28) * bossWobble * 0.32;
  } else {
    bossPivot.rotation.z = 0;
  }
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.t += dt * 4.5;
    pr.mesh.position.lerp(new THREE.Vector3(0, 2.5, -5.5), pr.t);
    if (pr.t >= 1) {
      scene.remove(pr.mesh);
      projectiles.splice(i, 1);
    }
  }

  // 5. Camera Follow
  const lookOffsetZ = state.zone === 'thantai' ? -1.8 : -1.5;
  const camTarget = new THREE.Vector3(
    player.root.position.x - Math.sin(camYaw) * 1.6,
    player.root.position.y + 1.85,
    player.root.position.z - Math.cos(camYaw) * 1.6
  );
  const desiredCamPos = new THREE.Vector3(
    player.root.position.x + Math.sin(camYaw) * camDist,
    player.root.position.y + 1.7 + Math.sin(camPitch) * camDist,
    player.root.position.z + Math.cos(camYaw) * camDist
  );
  camera.position.lerp(desiredCamPos, 0.18);
  camera.lookAt(camTarget);

  updateLabelPosition(player, 2.42);
  renderer.render(scene, camera);
}
animate();

// Support URL query params for instant preview screenshots
if (window.location.search.includes('zone=thantai')) {
  goToZone('thantai');
  camera.position.set(
    player.root.position.x + Math.sin(camYaw) * camDist,
    player.root.position.y + 1.7 + Math.sin(camPitch) * camDist,
    player.root.position.z + Math.cos(camYaw) * camDist
  );
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
