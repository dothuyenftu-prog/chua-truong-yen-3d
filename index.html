<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chùa Trường Yến 3D (Sansa Edition) — Đi Chùa Tích Phước & Xả Nghiệp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14100c;
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f5f5f4;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Frosted Glass UI System (Sansa Korean Temple App Style) */
  .glass-pill {
    background: rgba(28, 25, 23, 0.58);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    color: #f5f5f4;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  /* Top Bar */
  #top-bar {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .top-left-group {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .icon-circle-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  .icon-circle-btn:active {
    transform: scale(0.92);
  }
  .room-select-pill {
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    position: relative;
  }
  .room-select-pill select {
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    appearance: none;
    padding-right: 16px;
  }
  .room-select-pill select option {
    background: #1c1917;
    color: #fff;
  }

  .top-right-stats {
    pointer-events: auto;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    font-weight: 600;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat-item b {
    color: #fde68a;
    font-weight: 800;
  }

  /* Right Floating Chant / Audio Pill */
  .sub-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .merit-badge {
    pointer-events: auto;
    padding: 8px 15px;
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chant-btn {
    pointer-events: auto;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chant-btn.active {
    background: rgba(217, 119, 6, 0.72);
    border-color: #fde68a;
  }

  /* Center Translucent Feed Toast (Just like Sansa's "다정한 나무님이 합장으로 인사했어요") */
  #live-feed-pill {
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    padding: 13px 26px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    background: rgba(28, 25, 23, 0.62);
  }

  /* Floating Merit / Curse Popups */
  #floating-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    overflow: hidden;
  }
  .float-pop {
    position: absolute;
    font-weight: 800;
    font-size: 16px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    animation: popFloat 1.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  @keyframes popFloat {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -12px) scale(1.08); }
    100% { opacity: 0; transform: translate(-50%, -95px) scale(0.95); }
  }

  /* Virtual Walk Joystick (Bottom Left above dock) */
  #joystick-zone {
    position: fixed;
    bottom: 112px;
    left: 18px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(28, 25, 23, 0.45);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    z-index: 20;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #joystick-knob {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  #joystick-hint {
    position: absolute;
    bottom: -20px;
    width: 120px;
    text-align: center;
    font-size: 10.5px;
    color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 4px #000;
    pointer-events: none;
  }

  /* Camera & Avatar Quick Switch (Bottom Right above dock) */
  #quick-side-btns {
    position: fixed;
    bottom: 112px;
    right: 16px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .mini-pill-btn {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .mini-pill-btn.active {
    background: rgba(234, 179, 8, 0.75);
    color: #fff;
    border-color: #fef08a;
  }

  /* Bottom Frosted Glass Dock (Exact Sansa Layout: 합장 | 절하기 | 염주 + Khấn + Xả Nghiệp) */
  #bottom-bar-wrap {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: min(94vw, 520px);
  }
  #bottom-glass-dock {
    width: 100%;
    height: 78px;
    border-radius: 40px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    padding: 6px 10px;
    background: rgba(28, 25, 23, 0.62);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }
  .dock-action {
    border: none;
    background: transparent;
    color: #e7e5e4;
    height: 64px;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .dock-action svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dock-action.active {
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fde68a;
  }
  .dock-action.rage-highlight {
    color: #fca5a5;
  }
  .dock-action.rage-highlight.active {
    background: rgba(220, 38, 38, 0.35);
    border-color: rgba(248, 113, 113, 0.6);
    color: #fecaca;
  }

  /* Slide-up Glass Drawer for Khấn Nguyện & Chửi Xả Nghiệp */
  #drawer-modal {
    position: fixed;
    bottom: 104px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: min(94vw, 520px);
    max-height: 54vh;
    overflow-y: auto;
    z-index: 30;
    padding: 16px;
    border-radius: 26px;
    background: rgba(24, 21, 19, 0.86);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.26);
    box-shadow: 0 16px 48px rgba(0,0,0,0.75);
    display: none;
    opacity: 0;
    transition: all 0.22s ease;
  }
  #drawer-modal.open {
    display: block;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 800;
    color: #fde68a;
  }
  .drawer-close {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 800;
  }
  .preset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .preset-btn {
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #f5f5f4;
    padding: 10px 11px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .preset-btn:active {
    transform: scale(0.96);
  }
  .preset-btn.rage-btn {
    background: rgba(185, 28, 28, 0.35);
    border-color: rgba(248, 113, 113, 0.4);
    color: #fee2e2;
  }
  .preset-btn.gold-btn {
    background: rgba(217, 119, 6, 0.32);
    border-color: rgba(251, 191, 36, 0.45);
    color: #fef3c7;
  }
  .drawer-input-row {
    display: flex;
    gap: 7px;
    margin-top: 10px;
  }
  .drawer-input-row input {
    flex: 1;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 12px;
    padding: 9px 12px;
    color: #fff;
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
  }
  .drawer-send-btn {
    background: linear-gradient(135deg, #d97706, #92400e);
    border: 1px solid #fbbf24;
    color: #fff;
    font-weight: 800;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }

  /* Boss HP Bar inside Rage Hall */
  #boss-banner {
    position: fixed;
    top: 118px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 18;
    width: min(92vw, 420px);
    padding: 10px 16px;
    border-radius: 20px;
    background: rgba(45, 10, 14, 0.78);
    backdrop-filter: blur(14px);
    border: 1.5px solid rgba(248, 113, 113, 0.65);
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .boss-top {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 800;
    color: #fecaca;
  }
  .boss-hp-track {
    height: 9px;
    background: rgba(0,0,0,0.5);
    border-radius: 99px;
    overflow: hidden;
  }
  .boss-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ef4444, #fb923c);
    transition: width 0.2s;
  }
  .boss-speech {
    font-size: 12px;
    color: #fde68a;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="floating-layer"></div>

<!-- Top Frosted Glass HUD (Sansa Style) -->
<div id="top-bar">
  <div class="top-row">
    <div class="top-left-group">
      <button class="glass-pill icon-circle-btn" onclick="resetCameraBehindPlayer()" title="Về góc nhìn sau lưng">
        ↦
      </button>
      <div class="glass-pill room-select-pill">
        <select id="room-select" onchange="changeRoom(this.value)">
          <option value="hall">Thanh Liên Đường 01 (98 Phật tử) ▾</option>
          <option value="courtyard">Sân Chùa Ngàn Đệm (71 Phật tử) ▾</option>
          <option value="rage">Am Xả Nghiệp — Độ Khách & Xe ▾</option>
        </select>
      </div>
    </div>

    <div class="glass-pill top-right-stats">
      <div class="stat-item">👥 <b id="online-count">98</b></div>
      <div class="stat-item" style="cursor:pointer" onclick="toggleChantAudio()" id="speaker-icon">🔊</div>
      <div class="stat-item">🙇 <b id="bow-count">0</b></div>
      <div class="stat-item">✨ <b id="merit-count">888</b></div>
    </div>
  </div>

  <div class="sub-top-row">
    <div class="glass-pill merit-badge">
      <span>🧘 Người tu:</span>
      <select id="avatar-select" onchange="changeAvatarName(this.value)" style="background:transparent;border:none;color:#fde68a;font-weight:800;font-family:inherit;outline:none;cursor:pointer;">
        <option value="Sếp Thành">Sếp Thành</option>
        <option value="Minh Anh">Sale Minh Anh</option>
        <option value="Kiều Trang">Sale Kiều Trang</option>
        <option value="Huế">Sale Huế</option>
        <option value="Bích Thủy">Sale Bích Thủy</option>
        <option value="Ánh Nguyệt">Sale Ánh Nguyệt</option>
        <option value="Thế Anh">Thế Anh</option>
      </select>
    </div>

    <button class="glass-pill chant-btn" id="btn-auto-bow" onclick="toggleAutoBow()">
      🙏 Tự Lạy 108 Lạy
    </button>
  </div>
</div>

<!-- Boss Banner (only shown in Am Xả Nghiệp) -->
<div id="boss-banner">
  <div class="boss-top">
    <span id="boss-title">👻 BIA: KHÁCH HỎI 100 MÃ KHÔNG CHỐT</span>
    <span id="boss-hp-label">Độ Lì: 100%</span>
  </div>
  <div class="boss-hp-track"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
  <div class="boss-speech" id="boss-speech">"Cho anh xin báo giá 50 mã nữa rồi anh... về hỏi ý kiến vợ đã nhé!"</div>
</div>

<!-- Center Translucent Live Feed Pill (Exact Sansa Center Toast) -->
<div class="glass-pill" id="live-feed-pill">
  Sếp Thành vừa chắp tay bước vào Chánh Điện 🙏
</div>

<!-- Virtual Joystick for Walking Around the Temple Hall -->
<div id="joystick-zone">
  <div id="joystick-knob"></div>
  <div id="joystick-hint">Kéo để đi bộ</div>
</div>

<!-- Quick Camera / Cushion Teleport Buttons -->
<div id="quick-side-btns">
  <button class="glass-pill mini-pill-btn" onclick="toggleWideView()">🎥 Đổi Góc Nhìn (Sau Lưng / Toàn Cảnh)</button>
  <button class="glass-pill mini-pill-btn" onclick="walkToNearestCushion()">🪑 Ngồi Đệm Gần Nhất</button>
  <button class="glass-pill mini-pill-btn" onclick="shakeFortune()">🎋 Xin Quẻ Đại Cát</button>
</div>

<!-- Slide-up Glass Drawer (for Khấn Đơn / Xả Nghiệp Chửi Khách & Xe) -->
<div id="drawer-modal">
  <div class="drawer-header">
    <span id="drawer-title">🙏 DÂNG HƯƠNG & KHẤN NGUYỆN</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<!-- Bottom Frosted Glass Bar (Exact Sansa Style: Chắp Tay | Quỳ Lạy | Tràng Hạt/Mõ | Khấn | Xả Nghiệp) -->
<div id="bottom-bar-wrap">
  <div id="bottom-glass-dock">
    <!-- 1. 합장 (Chắp Tay) -->
    <button class="dock-action active" id="act-chaptay" onclick="doChapTay()">
      <svg viewBox="0 0 24 24"><path d="M12 2L9 12l3 9 3-9-3-10z"/><path d="M7 13l5-11 5 11"/></svg>
      <span id="label-chaptay">Chắp tay</span>
    </button>

    <!-- 2. 절하기 (Quỳ Lạy) -->
    <button class="dock-action" id="act-quylay" onclick="doQuyLay()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M6 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M4 21h16"/></svg>
      <span>Quỳ lạy</span>
    </button>

    <!-- 3. 염주 / Mõ (Tích Phước) -->
    <button class="dock-action" id="act-mo" onclick="doGoMo()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="19" cy="14" r="2"/><circle cx="15" cy="19" r="2"/><circle cx="9" cy="19" r="2"/><circle cx="5" cy="14" r="2"/><circle cx="7" cy="8" r="2"/></svg>
      <span>Gõ mõ</span>
    </button>

    <!-- 4. Khấn Nguyện -->
    <button class="dock-action" id="act-khan" onclick="openDrawer('khan')">
      <svg viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M9 4v4"/><path d="M15 4v4"/><path d="M6 12h12l-1 8H7l-1-8z"/></svg>
      <span>Khấn đơn</span>
    </button>

    <!-- 5. Xả Nghiệp (Chửi Khách / Xe) -->
    <button class="dock-action rage-highlight" id="act-xanghiep" onclick="openDrawer('rage')">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Xả nghiệp</span>
    </button>
  </div>
</div>

<script>
/* =========================================================
   1. STATE & AUDIO SYNTHESIZER
   ========================================================= */
const state = {
  merit: parseInt(localStorage.getItem('ty_merit_v2') || '888', 10),
  bows: parseInt(localStorage.getItem('ty_bows_v2') || '0', 10),
  room: 'hall', // 'hall' | 'courtyard' | 'rage'
  avatarName: 'Sếp Thành',
  chapTay: true,
  bowState: 0, // 0 idle, 1 kneeling down, 2 full prostration on cushion, 3 rising up
  bowTimer: 0,
  autoBow: false,
  soundOn: true,
  bossType: 'khach',
  bossHp: 100
};

function updateHUD() {
  localStorage.setItem('ty_merit_v2', state.merit);
  localStorage.setItem('ty_bows_v2', state.bows);
  document.getElementById('merit-count').textContent = state.merit.toLocaleString('vi-VN');
  document.getElementById('bow-count').textContent = state.bows;
}
updateHUD();

let audioCtx = null;
function ensureAudio() {
  if (!state.soundOn) return null;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playMoSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(760, now);
  osc.frequency.exponentialRampToValueAtTime(330, now + 0.09);
  gain.gain.setValueAtTime(0.75, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

function playBellSound(deep = true) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const freqs = deep ? [196, 392, 587.3, 784] : [523.25, 1046.5];
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    const dur = deep ? 3.8 : 1.6;
    gain.gain.setValueAtTime(0.28 / (i + 1), now);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  });
}

function playThunderSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const bufSize = ctx.sampleRate * 0.4;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.12));
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.85, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
  noise.connect(gain);
  gain.connect(ctx.destination);
  noise.start(now);
}

function speakVN(text) {
  if (!state.soundOn || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN';
    u.rate = 1.18;

   2. PROCEDURAL TEXTURES (Wood Floor, Ornate Mandala Thangka, Chibi Face)
   ========================================================= */
function createWoodFloorTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#36271c';
  ctx.fillRect(0, 0, 512, 512);
  // Plank lines
  for (let y = 0; y < 512; y += 64) {
    ctx.fillStyle = (y / 64) % 2 === 0 ? '#3a2a1e' : '#322318';
    ctx.fillRect(0, y, 512, 62);
    ctx.fillStyle = '#1f150e';
    ctx.fillRect(0, y + 62, 512, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 10);
  return tex;
}

function createMandalaBackdropTexture() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext('2d');

  // Deep antique temple tapestry background
  const bgGrad = ctx.createRadialGradient(512, 256, 30, 512, 256, 520);
  bgGrad.addColorStop(0, '#5c2d16');
  bgGrad.addColorStop(0.5, '#3b190d');
  bgGrad.addColorStop(1, '#1e0d07');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1024, 512);

  // Ornate border
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 10;
  ctx.strokeRect(14, 14, 996, 484);

  // Decorative floral clouds across background
  for (let i = 0; i < 90; i++) {
    const rx = (i * 137) % 980 + 22;
    const ry = (i * 293) % 460 + 26;
    ctx.fillStyle = i % 3 === 0 ? 'rgba(180, 83, 9, 0.28)' : (i % 3 === 1 ? 'rgba(21, 128, 61, 0.25)' : 'rgba(185, 28, 28, 0.25)');
    ctx.beginPath();
    ctx.arc(rx, ry, 18 + (i % 16), 0, Math.PI * 2);
    ctx.fill();
  }

  // Center Sacred Lotus Mandala Halo behind Buddha
  const radii = [215, 185, 150, 115, 80];
  const colors = ['#15803d', '#b91c1c', '#d97706', '#991b1b', '#f59e0b'];
  radii.forEach((r, idx) => {
    ctx.beginPath();
    ctx.arc(512, 240, r, 0, Math.PI * 2);
    ctx.fillStyle = colors[idx];
    ctx.globalAlpha = 0.68;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#fde68a';
    ctx.stroke();
  });
  ctx.globalAlpha = 1.0;

  // Lotus petals around the Mandala
  for (let a = 0; a < 24; a++) {
    const ang = (a / 24) * Math.PI * 2;
    const px = 512 + Math.cos(ang) * 198;
    const py = 240 + Math.sin(ang) * 198;
    ctx.fillStyle = a % 2 === 0 ? '#f59e0b' : '#dc2626';
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  // Left & Right Attending Bodhisattvas on Tapestry
  [210, 814].forEach(bx => {
    ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
    ctx.beginPath();
    ctx.arc(bx, 185, 72, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#d97706';
    ctx.beginPath();
    ctx.arc(bx, 175, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx - 45, 380);
    ctx.lineTo(bx + 45, 380);
    ctx.lineTo(bx + 25, 210);
    ctx.lineTo(bx - 25, 210);
    ctx.closePath();
    ctx.fill();
  });

  return new THREE.CanvasTexture(c);
}

function createWindowForestTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const ctx = c.getContext('2d');
  // Daylight sky + green pine mountain outside window
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#bae6fd');
  g.addColorStop(0.55, '#86efac');
  g.addColorStop(1, '#166534');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 256);

  // Lattice wooden bars
  ctx.strokeStyle = '#271a10';
  ctx.lineWidth = 10;
  for (let x = 0; x <= 512; x += 64) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
  }
  for (let y = 0; y <= 256; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

// Touch/Mouse Orbit on Canvas
let draggingCanvas = false;
let lastPtr = { x: 0, y: 0 };
renderer.domElement.addEventListener('pointerdown', (e) => {
  draggingCanvas = true;
  lastPtr = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointermove', (e) => {
  if (!draggingCanvas) return;
  const dx = e.clientX - lastPtr.x;
  const dy = e.clientY - lastPtr.y;
  lastPtr = { x: e.clientX, y: e.clientY };
  camYaw -= dx * 0.006;
  camPitch = Math.max(0.06, Math.min(0.85, camPitch + dy * 0.005));
});
window.addEventListener('pointerup', () => { draggingCanvas = false; });

// Virtual Joystick Events
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false;

function handleJoyMove(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const maxR = 32;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) {
    dx = (dx / dist) * maxR;
    dy = (dy / dist) * maxR;
  }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / maxR;
  joyVec.y = dy / maxR;
}

joyZone.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  joyActive = true;
  handleJoyMove(e.clientX, e.clientY);
});
window.addEventListener('pointermove', (e) => {
  if (!joyActive) return;
  handleJoyMove(e.clientX, e.clientY);
});
window.addEventListener('pointerup', () => {
  if (!joyActive) return;
  joyActive = false;
  joyKnob.style.transform = 'translate(0px, 0px)';
  joyVec.x = 0;
  joyVec.y = 0;
});

/* =========================================================
   8. 60 FPS ANIMATION LOOP (Player Walk + Prostration + 32 NPC Crowd Bowing)
   ========================================================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.getElapsedTime();

  // 1. Player Walking Movement (Joystick or WASD)
  let moveX = joyVec.x;
  let moveZ = joyVec.y;
  if (keys['KeyW'] || keys['ArrowUp']) moveZ = -1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ = 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

  if ((Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05) && state.bowState === 0) {
    const speed = 3.8 * dt;
    const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    player.root.position.addScaledVector(forward, -moveZ * speed);
    player.root.position.addScaledVector(right, moveX * speed);

    // Clamp inside hall bounds
    player.root.position.x = Math.max(-9.5, Math.min(9.5, player.root.position.x));
    player.root.position.z = Math.max(-7.5, Math.min(11.5, player.root.position.z));

    // Rotate character in movement direction & waddle walk animation
    const targetRot = Math.atan2(-moveX, moveZ) + camYaw;
    player.root.rotation.y = targetRot;
    player.bodyPivot.position.y = Math.abs(Math.sin(elapsed * 12)) * 0.08;
    player.bodyPivot.rotation.z = Math.sin(elapsed * 12) * 0.06;
  } else {
    player.bodyPivot.position.y = 0;
    player.bodyPivot.rotation.z = 0;
  }

  // 2. Player Full Prostration Animation (절하기 — Kneel & Bow onto Cushion)
  if (state.bowState === 1) {
    state.bowTimer += dt * 2.2;
    const p = Math.min(1, state.bowTimer);
    player.root.rotation.y = 0; // Face Buddha
    player.bodyPivot.rotation.x = -p * 1.38;
    player.bodyPivot.position.y = -p * 0.35;
    player.bodyPivot.position.z = -p * 0.35;
    if (p >= 1) { state.bowState = 2; state.bowTimer = 0; }
  } else if (state.bowState === 2) {
    state.bowTimer += dt * 2.4;
    if (state.bowTimer >= 1) { state.bowState = 3; state.bowTimer = 0; }
  } else if (state.bowState === 3) {
    state.bowTimer += dt * 2.2;
    const p = 1 - Math.min(1, state.bowTimer);
    player.bodyPivot.rotation.x = -p * 1.38;
    player.bodyPivot.position.y = -p * 0.35;
    player.bodyPivot.position.z = -p * 0.35;
    if (state.bowTimer >= 1) {
      state.bowState = 0;
      player.bodyPivot.rotation.x = 0;
      player.bodyPivot.position.set(0, 0, 0);
      if (state.autoBow) setTimeout(doQuyLay, 280);
    }
  }

  // 3. Animate the Crowd of 32 Fellow Chibi Devotees (Bowing, Meditating, Clasping Hands)
  npcs.forEach(npc => {
    npc.root.visible = (state.room !== 'rage');
    if (!npc.root.visible) return;
    if (npc.mode === 0) {
      // Periodic bowing cycle on their cushion
      const cyc = (elapsed * 0.9 + npc.phase) % 5.0;
      let b = 0;
      if (cyc < 1.2) b = cyc / 1.2;
      else if (cyc < 2.2) b = 1.0;
      else if (cyc < 3.4) b = 1.0 - (cyc - 2.2) / 1.2;
      npc.bodyPivot.rotation.x = -b * 1.32;
      npc.bodyPivot.position.y = -b * 0.32;
      npc.bodyPivot.position.z = -b * 0.30;
    } else if (npc.mode === 1) {
      // Seated meditation on cushion
      npc.bodyPivot.position.y = -0.25 + Math.sin(elapsed * 2 + npc.phase) * 0.015;
      npc.bodyPivot.rotation.x = -0.06;
    } else {
      // Standing with clasped hands bowing head gently
      npc.bodyPivot.rotation.x = -0.08 - Math.sin(elapsed * 1.5 + npc.phase) * 0.06;
    }
  });

  // 4. Boss Wobble & Projectiles in Am Xả Nghiệp
  if (bossWobble > 0) {
    bossWobble = Math.max(0, bossWobble - dt * 2.8);
    bossPivot.rotation.z = Math.sin(elapsed * 28) * bossWobble * 0.32;
  } else {
    bossPivot.rotation.z = 0;
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.t += dt * 4.5;
    pr.mesh.position.lerp(new THREE.Vector3(0, 2.5, -5.5), pr.t);
    if (pr.t >= 1) {
      scene.remove(pr.mesh);
      projectiles.splice(i, 1);
    }
  }

  // 5. Third-Person Follow Camera behind Player (Exact Sansa Perspective!)
  const camTarget = new THREE.Vector3(
    player.root.position.x,
    player.root.position.y + 1.85,
    player.root.position.z - 1.5
  );
  const desiredCamPos = new THREE.Vector3(
    player.root.position.x + Math.sin(camYaw) * camDist,
    player.root.position.y + 1.7 + Math.sin(camPitch) * camDist,
    player.root.position.z + Math.cos(camYaw) * camDist
  );
  camera.position.lerp(desiredCamPos, 0.18);
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}
animate();

// Support URL query params for instant preview screenshots
if (window.location.search.includes('view=wide')) {
  toggleWideView();
  camera.position.set(player.root.position.x + Math.sin(camYaw) * camDist, player.root.position.y + 1.7 + Math.sin(camPitch) * camDist, player.root.position.z + Math.cos(camYaw) * camDist);
  renderer.render(scene, camera);
}
if (window.location.search.includes('room=courtyard')) changeRoom('courtyard');
if (window.location.search.includes('room=rage')) {
  openDrawer('rage');
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
